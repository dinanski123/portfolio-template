<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Ferdinand De Gracia — AI, Web & Digital Systems</title>
    <meta name="description" content="Portfolio of Ferdinand De Gracia — AI-assisted software, web apps, automation, media systems and digital products." />
    <meta name="author" content="Ferdinand De Gracia" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#F4F4ED" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ferdinand De Gracia" />
    <meta property="og:title" content="Ferdinand De Gracia — AI, Web & Digital Systems" />
    <meta property="og:description" content="AI-assisted software, web apps, automation, media systems and digital products." />
    <meta name="twitter:card" content="summary_large_image" />

    <script>
      (function () {
        try {
          document.documentElement.dataset.theme =
            localStorage.getItem('theme') === 'dark' ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
        if (document.documentElement.dataset.theme === 'dark') {
          var bar = document.querySelector('meta[name="theme-color"]');
          if (bar) bar.setAttribute('content', '#070B14');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
